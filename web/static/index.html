<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDS MCP Agent</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --user-msg-bg: #2563eb;
            --user-msg-text: #ffffff;
            --bot-msg-bg: #e5e7eb;
            --bot-msg-text: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header {
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .download-btn {
            background-color: white;
            color: var(--primary-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }

        .download-btn:hover {
            background-color: #f3f4f6;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 0.25rem;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            color: var(--bot-msg-text);
            border-bottom-left-radius: 0.25rem;
        }

        .input-area {
            padding: 1rem;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .step {
            font-size: 0.85rem;
            padding: 0.5rem 0.75rem;
            margin: 0.25rem 0;
            border-radius: 0.5rem;
            background-color: #fef3c7;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .step.thinking {
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .step .icon {
            font-size: 1rem;
        }

        .step .step-content {
            flex: 1;
        }

        .step .tool-args {
            margin: 0.5rem 0 0 0;
            padding: 0.5rem;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <span>IDS MCP Agent</span>
            <button id="download-btn" class="download-btn">Download IDS</button>
        </header>
        <div id="chat-history">
            <div class="message bot">
                Hello! I can help you create and validate IDS files. What would you like to do?
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const downloadBtn = document.getElementById('download-btn');

        downloadBtn.addEventListener('click', () => {
            window.location.href = '/download_ids';
        });

        let messages = [];

        function addStep(type, data) {
            const div = document.createElement('div');
            div.className = `step ${type}`;

            if (type === 'thinking') {
                div.innerHTML = `<span class="icon">🤔</span> <span class="step-content"><strong>Thinking:</strong> ${data || 'Processing...'}</span>`;
            } else if (type === 'tool_use') {
                const argsStr = data.args ? JSON.stringify(data.args, null, 2) : '';
                div.innerHTML = `<span class="icon">🔧</span> <div class="step-content"><strong>Using tool: ${data.tool}</strong>${argsStr ? `<pre class="tool-args">${argsStr}</pre>` : ''}</div>`;
            } else if (type === 'tool_result') {
                const icon = data.success ? '✅' : '❌';
                const status = data.success ? 'completed' : `failed: ${data.error}`;
                div.innerHTML = `<span class="icon">${icon}</span> <span class="step-content">Tool ${status}</span>`;
            }

            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div;
        }

        function updateStep(stepDiv, type, data) {
            if (!stepDiv) return;
            if (type === 'thinking' && data) {
                const contentSpan = stepDiv.querySelector('.step-content');
                if (contentSpan) {
                    contentSpan.innerHTML = `<strong>Thinking:</strong> ${data}`;
                }
            }
        }

        function removeStep(stepDiv) {
            if (stepDiv && stepDiv.parentNode) {
                stepDiv.parentNode.removeChild(stepDiv);
            }
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user' : 'bot'}`;
            div.textContent = content;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            messages.push({ role, content });
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            const originalBtnText = sendBtn.textContent;
            sendBtn.textContent = '...';

            let thinkingStep = null;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ messages: messages })
                });

                if (!response.ok) {
                    throw new Error(`Error: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const event = JSON.parse(data);

                                if (event.type === 'thinking') {
                                    if (!thinkingStep) {
                                        thinkingStep = addStep('thinking', event.content);
                                    } else {
                                        updateStep(thinkingStep, 'thinking', event.content);
                                    }
                                } else if (event.type === 'tool_use') {
                                    // Remove thinking step when tool is called
                                    if (thinkingStep) {
                                        removeStep(thinkingStep);
                                        thinkingStep = null;
                                    }
                                    addStep('tool_use', { tool: event.tool, args: event.args });
                                } else if (event.type === 'tool_result') {
                                    addStep('tool_result', { success: event.success, error: event.error });
                                } else if (event.type === 'response') {
                                    // Remove thinking step if still present
                                    if (thinkingStep) {
                                        removeStep(thinkingStep);
                                        thinkingStep = null;
                                    }
                                    addMessage('model', event.content);
                                } else if (event.type === 'error') {
                                    throw new Error(event.message);
                                }
                            } catch (parseErr) {
                                console.error('Parse error:', parseErr);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                if (thinkingStep) removeStep(thinkingStep);
                addMessage('model', 'Sorry, something went wrong. Please check the console and try again.');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.textContent = originalBtnText;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
